name: 收集IP地址并保存到文件
on:
  schedule:
    - cron: '7,37 0-15 * * *'
    - cron: '7,37 16-23 * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/**'
      - 'autoip6-0.py'
      - 'scripts/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - '.github/workflows/**'
      - 'autoip6-0.py'

env:
  PYTHON_VERSION: '3.12'
  TZ: 'Asia/Shanghai'

permissions:
  contents: write

jobs:
  collect:
    name: 🚀 收集 IP
    runs-on: ubuntu-latest
    outputs:
      trigger_type: ${{ steps.debug.outputs.trigger_type }}
    steps:
      - name: 🕐 设置时区
        run: sudo timedatectl set-timezone Asia/Shanghai

      - name: 🔍 调试触发信息
        id: debug
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "trigger_type=scheduled" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "trigger_type=manual" >> $GITHUB_OUTPUT
          else
            echo "trigger_type=${{ github.event_name }}" >> $GITHUB_OUTPUT
          fi
          echo "run_at=$(date '+%Y-%m-%d %H:%M:%S')"
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: 🧪 运行采集脚本
        id: ip-run
        timeout-minutes: 20
        run: |
          set -e
          python autoip6-0.py
      - name: ✅ 校验输出文件
        id: file-check
        run: |
          if [ -f "ip.txt" ] && [ -s "ip.txt" ]; then
            echo "ok=1" >> $GITHUB_OUTPUT
          else
            echo "ok=0" >> $GITHUB_OUTPUT
            exit 1
          fi
      - name: 💾 提交更新
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            chore: 更新 IP 列表
            • 触发：${{ steps.debug.outputs.trigger_type }}
            • 时间：$(date '+%Y-%m-%d %H:%M:%S')
          file_pattern: 'ip.txt ipv6.txt non_us_ips/*'
          skip_fetch: true

      - name: Keepalive，防止定时休眠
        run: |
          echo "$(date '+%Y-%m-%d %H:%M:%S')" > .keepalive
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" || true
  cleanup:
    name: 🧹 清理旧运行记录
    needs: collect
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write
      contents: read
    steps:
      - name: 删除旧 runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 5
