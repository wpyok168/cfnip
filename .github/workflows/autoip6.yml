name: 🌐 IP 自动收集更新

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: '手动触发原因'
        required: false
        default: '手动执行'
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/**'
      - 'autoip6.py'
      - 'scripts/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - '.github/workflows/**'
      - 'autoip6.py'

env:
  PYTHON_VERSION: '3.12'
  RETAIN_DAYS: 1
  KEEP_MINIMUM_RUNS: 8
  TZ: 'Asia/Shanghai'

permissions:
  contents: write
  actions: write

jobs:
  collect-ip-address:
    name: 🚀 IP 收集任务
    runs-on: ubuntu-latest
    outputs:
      trigger_type: ${{ steps.debug.outputs.trigger_type }}
      time_str: ${{ steps.timestamp.outputs.time }}
      has_changed: ${{ steps.changes-check.outputs.has_changes }}

    steps:
      - name: 🕐 设置时区
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          echo "当前系统时间：$(date)"
          echo "UTC 时间：$(date -u)"

      - name: 🔍 判断触发来源
        id: debug
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "trigger_type=scheduled" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "trigger_type=manual" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "trigger_type=push" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "trigger_type=pr" >> $GITHUB_OUTPUT
          else
            echo "trigger_type=other" >> $GITHUB_OUTPUT
          fi

      - name: 📌 生成时间戳
        id: timestamp
        run: |
          now=$(date +'%Y-%m-%d %H:%M:%S %Z')
          utc_now=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          echo "time=$now" >> $GITHUB_OUTPUT
          echo "utc_time=$utc_now" >> $GITHUB_OUTPUT

      - name: 🧹 清理旧运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: ${{ env.RETAIN_DAYS }}
          keep_minimum_runs: ${{ env.KEEP_MINIMUM_RUNS }}
          repository: ${{ github.repository }}

      - name: 📥 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🌍 运行 IP 收集脚本
        id: run_script
        run: |
          echo "开始执行 autoip6.py"
          start=$(date +%s)
          python autoip6.py
          end=$(date +%s)
          cost=$(( end - start ))
          echo "耗时：${cost} 秒"

      - name: 🧹 IP 去重 + 合法性校验
        run: |
          python3 - <<'PY'
          from ipaddress import IPv4Address, IPv6Address, AddressValueError

          def process_file(src_name, dst_name, version):
              seen = set()
              lines_out = []
              with open(src_name, "r", encoding="utf-8") as f:
                  for raw in f:
                      line = raw.strip()
                      if not line:
                          continue
                      try:
                          if version == 4:
                              obj = IPv4Address(line)
                          else:
                              obj = IPv6Address(line)
                      except AddressValueError:
                          continue
                      if obj not in seen:
                          seen.add(obj)
                          lines_out.append(str(obj))
              if version == 4:
                  lines_out.sort(key=lambda x: int(IPv4Address(x)))
              else:
                  lines_out.sort()
              with open(dst_name, "w", encoding="utf-8") as f:
                  f.write("\n".join(lines_out) + "\n")
              print(f"{dst_name} | 有效数量：{len(lines_out)}")

          process_file("ip.txt", "ip.txt", 4)
          process_file("ipv6.txt", "ipv6.txt", 6)
          PY

      - name: 📋 统计文件行数
        id: file-check
        run: |
          if [ -f "ip.txt" ] && [ -s "ip.txt" ]; then
              v4=$(wc -l < ip.txt | tr -d ' ')
              echo "ip_count=$v4" >> $GITHUB_OUTPUT
          else
              echo "ip_count=0" >> $GITHUB_OUTPUT
          fi

          if [ -f "ipv6.txt" ] && [ -s "ipv6.txt" ]; then
              v6=$(wc -l < ipv6.txt | tr -d ' ')
              echo "ipv6_count=$v6" >> $GITHUB_OUTPUT
          else
              echo "ipv6_count=0" >> $GITHUB_OUTPUT
          fi

          if [ -d "non_us_ips" ]; then
              cnt=$(find non_us_ips -name "*.txt" -type f | wc -l)
              latest=$(find non_us_ips -name "*.txt" -type f | sort -r | head -1)
              echo "non_us_files=$cnt" >> $GITHUB_OUTPUT
              echo "latest_non_us=$latest" >> $GITHUB_OUTPUT
          else
              echo "non_us_files=0" >> $GITHUB_OUTPUT
              echo "latest_non_us=无" >> $GITHUB_OUTPUT
          fi

      - name: 📊 判断是否有更新
        id: changes-check
        run: |
          if git diff --quiet HEAD -- ip.txt ipv6.txt non_us_ips/; then
              echo "has_changes=false" >> $GITHUB_OUTPUT
          else
              echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: 💾 提交推送变更
        if: ${{ steps.changes-check.outputs.has_changes == 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            chore: auto update ip list
            • trigger: ${{ steps.debug.outputs.trigger_type }}
            • time: ${{ steps.timestamp.outputs.time }}
            • v4: ${{ steps.file-check.outputs.ip_count }}
            • v6: ${{ steps.file-check.outputs.ipv6_count }}
          commit_user_name: IP Bot
          commit_user_email: bot@github.com
          file_pattern: 'ip.txt ipv6.txt non_us_ips/*'
          skip_fetch: true
          skip_checkout: true

      - name: 📈 工作流总结
        if: always()
        run: |
          echo "## 🎯 IP地址收集总结" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 执行详情" >> $GITHUB_STEP_SUMMARY
          echo "- **触发方式:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **触发类型:** ${{ steps.debug.outputs.trigger_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **北京时间:** ${{ steps.timestamp.outputs.time }}" >> $GITHUB_STEP_SUMMARY
          echo "- **UTC:** ${{ steps.timestamp.outputs.utc_time }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 文件状态" >> $GITHUB_STEP_SUMMARY
          echo "- **IPv4:** ${{ steps.file-check.outputs.ip_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **IPv6:** ${{ steps.file-check.outputs.ipv6_count }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.file-check.outputs.non_us_files }}" != "0" ]; then
            echo "- **非美 IP 文件数量:** ${{ steps.file-check.outputs.non_us_files }}" >> $GITHUB_STEP_SUMMARY
            echo "- **最新文件:** ${{ steps.file-check.outputs.latest_non_us }}" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ steps.changes-check.outputs.has_changes }}" == "true" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ✅ 已提交更新" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📭 无变更" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*由 GitHub Actions 自动生成 - 北京时间*" >> $GITHUB_STEP_SUMMARY

      - name: ✅ 成功提示
        if: ${{ success() && steps.changes-check.outputs.has_changes == 'true' }}
        run: |
          echo "🎉 IP 列表更新并推送完成"
          echo "IPv4：${{ steps.file-check.outputs.ip_count }}"
          echo "IPv6：${{ steps.file-check.outputs.ipv6_count }}"

      - name: ℹ️ 无变更提示
        if: ${{ success() && steps.changes-check.outputs.has_changes == 'false' }}
        run: |
          echo "ℹ️ IP 列表没有变化，跳过提交"
