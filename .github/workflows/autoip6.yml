name: 🌐 收集IP地址并保存到文件

on:
  schedule:
    # UTC，换算北京时间自行计算；下面示例：北京时间 00:30, 01:30 …
    - cron: '0,30 * * * *'
      timezone: 'Asia/Shanghai'
    # 如果想要额外整点：取消下面注释，注意会叠加
    # - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: '手动触发原因'
        required: false
        default: '手动执行'
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/**'
      - 'autoip6.py'
      - 'scripts/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - '.github/workflows/**'
      - 'autoip6.py'

env:
  PYTHON_VERSION: '3.12'
  RETAIN_DAYS: 1
  KEEP_MINIMUM_RUNS: 8
  TZ: 'Asia/Shanghai'

permissions:
  contents: write
  actions: write

jobs:
  collect-ip-addresses:
    name: 🚀 收集IP地址
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.timestamp.outputs.time }}
      files_changed: ${{ steps.changes-check.outputs.has_changes }}
      trigger_type: ${{ steps.debug.outputs.trigger_type }}

    steps:
      - name: 🕐 设置北京时间时区
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          echo "当前系统时间: $(date)"
          echo "当前UTC时间: $(date -u)"

      - name: 🔍 调试触发信息
        id: debug
        run: |
          echo "🎯 工作流触发方式: ${{ github.event_name }}"
          echo "📅 当前系统时间: $(date)"
          echo "🕐 当前UTC时间: $(date -u)"
          echo "🌏 时区: $(cat /etc/timezone)"
          echo "🔍 仓库: ${{ github.repository }}"
          echo "🌿 分支: ${{ github.ref }}"
          echo "👤 触发者: ${{ shturl.cc/BK }}"

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "trigger_type=scheduled" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "trigger_type=manual" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "trigger_type=push" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "trigger_type=pull_request" >> $GITHUB_OUTPUT
          else
            echo "trigger_type=other" >> $GITHUB_OUTPUT
          fi

      - name: 📝 生成北京时间戳
        id: timestamp
        run: |
          current_time=$(date +'%Y-%m-%d %H:%M:%S %Z')
          utc_time=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          echo "time=$current_time" >> $GITHUB_OUTPUT
          echo "utc_time=$utc_time" >> $GITHUB_OUTPUT

      - name: 🧹 清理旧工作流运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: ${{ env.RETAIN_DAYS }}
          keep_minimum_runs: ${{ env.KEEP_MINIMUM_RUNS }}
          repository: ${{ github.repository }}

      - name: 📥 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 安装依赖
        run: |
          pip install --upgrade pip
          pip install requests ipaddress pytz
          echo "✅ 依赖安装成功"

      - name: 🌍 收集IP地址
        id: ip-collection
        run: |
          echo "🕸️ 开始收集IP地址..."
          start_time=$(date +%s)
          if python autoip6.py; then
            end_time=$(date +%s)
            duration=$((end_time - start_time))
            echo "result=success" >> $GITHUB_OUTPUT
            echo "✅ IP收集完成，耗时 ${duration}s"
          else
            echo "result=failure" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: 🔍 验证生成的文件
        id: file-check
        run: |
          if [ -f "ip.txt" ] && [ -s "ip.txt" ]; then
            ip_count=$(wc -l < ip.txt | tr -d ' ')
            echo "ip_count=$ip_count" >> $GITHUB_OUTPUT
          else
            echo "❌ ip.txt 缺失或为空"
            exit 1
          fi

          if [ -f "ipv6.txt" ] && [ -s "ipv6.txt" ]; then
            ipv6_count=$(wc -l < ipv6.txt | tr -d ' ')
            echo "ipv6_count=$ipv6_count" >> $GITHUB_OUTPUT
          else
            echo "❌ ipv6.txt 缺失或为空"
            exit 1
          fi

          non_us_files=$(find non_us_ips -name "non_us_ips_*.txt" -type f 2>/dev/null | wc -l)
          if [ "$non_us_files" -gt 0 ]; then
            latest_non_us=$(find non_us_ips -name "non_us_ips_*.txt" -type f | sort -r | head -1)
            non_us_count=$(wc -l < "$latest_non_us" | tr -d ' ')
            echo "non_us_files=$non_us_files" >> $GITHUB_OUTPUT
            echo "non_us_count=$non_us_count" >> $GITHUB_OUTPUT
            echo "latest_non_us=$latest_non_us" >> $GITHUB_OUTPUT
          else
            echo "non_us_files=0" >> $GITHUB_OUTPUT
            echo "non_us_count=0" >> $GITHUB_OUTPUT
          fi

      - name: 📊 检查文件变更
        id: changes-check
        run: |
          if git diff --quiet HEAD -- ip.txt ipv6.txt non_us_ips/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: 💾 提交并推送变更
        id: auto-commit
        if: ${{ steps.changes-check.outputs.has_changes == 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            chore: 更新IP地址 [自动]

            • 触发类型: ${{ steps.debug.outputs.trigger_type }}
            • 更新时间(北京时间): ${{ steps.timestamp.outputs.time }}
            • ip.txt: ${{ steps.file-check.outputs.ip_count }} IPv4
            • ipv6.txt: ${{ steps.file-check.outputs.ipv6_count }} IPv6
            • workflow: ${{ github.workflow }}
          commit_user_name: '🤖 GitHub Actions 机器人'
          commit_user_email: 'actions@users.noreply.github.com'
          commit_options: '--signoff'
          file_pattern: 'ip.txt ipv6.txt non_us_ips/*'
          skip_fetch: true
          skip_checkout: true

      - name: 📈 工作流总结
        if: always()
        run: |
          echo "## 🎯 IP地址收集总结" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 执行详情" >> $GITHUB_STEP_SUMMARY
          echo "- **触发方式:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **触发类型:** ${{ steps.debug.outputs.trigger_type }}" >> $GITHUB_OUTPUT
          echo "- **北京时间:** ${{ steps.timestamp.outputs.time }}" >> $GITHUB_STEP_SUMMARY
          echo "- **UTC:** ${{ steps.timestamp.outputs.utc_time }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📁 文件状态" >> $GITHUB_STEP_SUMMARY
          echo "- **IPv4:** ${{ steps.file-check.outputs.ip_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **IPv6:** ${{ steps.file-check.outputs.ipv6_count }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.file-check.outputs.non_us_files }}" != "0" ]; then
            echo "- **非美IP文件数:** ${{ steps.file-check.outputs.non_us_files }}" >> $GITHUB_STEP_SUMMARY
            echo "- **最新文件:** ${{ steps.file-check.outputs.latest_non_us }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ steps.changes-check.outputs.has_changes }}" == "true" ]]; then
            echo "### ✅ 已提交更新" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 📭 无变更" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*由 GitHub Actions 自动生成 - 北京时间*" >> $GITHUB_STEP_SUMMARY

      - name: 🎉 成功更新通知
        if: ${{ success() && steps.changes-check.outputs.has_changes == 'true' }}
        run: |
          echo "🎉 IP 更新推送成功"
          echo "IPv4: ${{ steps.file-check.outputs.ip_count }}"
          echo "IPv6: ${{ steps.file-check.outputs.ipv6_count }}"

      - name: ℹ️ 无变更通知
        if: ${{ success() && steps.changes-check.outputs.has_changes == 'false' }}
        run: |
          echo "ℹ️ IP 文件已是最新"
