def _strip_json_comments(text: str) -> str:
    out = []
    i = 0
    n = len(text)
    in_string = False
    escape = False
    while i < n:
        ch = text[i]
        if in_string:
            out.append(ch)
            if escape:
                escape = False
            elif ch == '\\':
                escape = True
            elif ch == '"':
                in_string = False
            i += 1
            continue
        if ch == '"':
            in_string = True
            out.append(ch)
            i += 1
            continue
        if ch == '/' and i + 1 < n and text[i + 1] == '/':
            while i < n and text[i] != '\n':
                i += 1
            continue
        out.append(ch)
        i += 1
    return ''.join(out)


def _load_json_lenient(path: str):
    with open(path, 'r', encoding='utf-8-sig') as f:
        raw = f.read()
    if not raw.strip():
        raise ValueError(f'{path} 是空文件')
    cleaned = _strip_json_comments(raw)
    return json.loads(cleaned)


