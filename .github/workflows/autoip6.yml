    def is_ip_blacklisted(self, ip_obj):
        return any(ip_obj in net for net in self.blacklist_nets)

    def is_ip_in_cf_range(self, ip_obj):
        if isinstance(ip_obj, ipaddress.IPv4Address):
            return any(ip_obj in net for net in self.cf_v4_nets)
        else:
            return any(ip_obj in net for net in self.cf_v6_nets)

    def _build_pool(self, ip: str, is_v6: bool, domain: str):
        tr = self.config["trace_settings"]
        port = tr["port"]
        pool = urllib3.HTTPSConnectionPool(
            ip,
            port=port,
            assert_hostname=domain,
            server_hostname=domain,
            cert_reqs=ssl.CERT_NONE if not tr.get("verify_ssl", False) else ssl.CERT_REQUIRED,
            retries=False,
            timeout=urllib3.Timeout(connect=self.config["request_settings"]["trace_timeout"],
                                    read=self.config["request_settings"]["trace_timeout"]),
        )
        return pool, domain

    def trace_check(self, ip: str, is_v6: bool):
        tr = self.config["trace_settings"]
        if not tr.get("enabled", True):
            return True, None
        req_cfg = self.config["request_settings"]
        time.sleep(random.uniform(*req_cfg["trace_random_delay"]))
        mode = tr.get("mode", "trace")
        path = tr["trace_path"] if mode == "trace" else tr["header_path"]

        domains = list(tr["sni_domains"])
        random.shuffle(domains)

        for domain in domains:
            pool = None
            try:
                pool, _ = self._build_pool(ip, is_v6, domain)
                headers = {
                    "Host": domain,
                    "User-Agent": random.choice(UA_POOL),
                    "Accept": "*/*",
                }
                resp = pool.request("GET", path, headers=headers, redirect=False, retries=False)
                status = resp.status
                body = resp.data.decode("utf-8", "ignore") if resp.data else ""
                resp_headers = {k.lower(): v for k, v in resp.headers.items()}
                server = resp_headers.get("server", "")

                if mode == "trace":
                    if status == 200 and "loc=" in body and server == "cloudflare":
                        m = re.search(r"loc=([A-Z]{2})", body)
                        cc = m.group(1) if m else None
                        return True, cc
                else:
                    cf_ray = resp_headers.get("cf-ray", "")
                    if status in (200, 301, 302, 403) and cf_ray and server == "cloudflare":
                        colo = cf_ray.rsplit("-", 1)[-1].upper()
                        if len(colo) == 3:
                            return True, colo
                        return True, None
            except Exception:
                continue
            finally:
                if pool is not None:
                    try:
                        pool.close()
                    except Exception:
                        pass
        return False, None

    def speed_test(self, ip: str, is_v6: bool):
        sp = self.config["speed_settings"]
        if not sp["enabled"]:
            return None
        family = socket.AF_INET6 if is_v6 else socket.AF_INET
        port = 443
        try:
            t0 = time.perf_counter()
            sock = socket.socket(family, socket.SOCK_STREAM)
            sock.settimeout(sp["speed_timeout"])
            try:
                sock.connect((ip, port))
            finally:
                sock.close()
            tcp_rtt = (time.perf_counter() - t0) * 1000
        except Exception:
            return None

        tr = self.config["trace_settings"]
        domain = random.choice(tr["sni_domains"])
        pool = None
        try:
            pool, _ = self._build_pool(ip, is_v6, domain)
            t0 = time.perf_counter()
            pool.request("GET", sp["test_path"],
                         headers={"Host": domain},
                         redirect=False, retries=False)
            http_rtt = (time.perf_counter() - t0) * 1000
            return {"tcp": round(tcp_rtt, 2), "http_ttfb": round(http_rtt, 2)}
        except Exception:
            return {"tcp": round(tcp_rtt, 2), "http_ttfb": None}
        finally:
            if pool is not None:
                try:
                    pool.close()
                except Exception:
                    pass

    def run_trace_filter(self, ip_set, is_v6: bool):
        flt = self.config["filter_settings"]
        if is_v6 and not flt.get("enable_trace_check_v6", False):
            return [(ip, None) for ip in ip_set]
        if not is_v6 and not flt.get("enable_trace_check_v4", True):
            return [(ip, None) for ip in ip_set]
        if not self.config["trace_settings"].get("enabled", True):
            return [(ip, None) for ip in ip_set]

        print(f"\n🔎 开始 SNI 预检 (mode={self.config['trace_settings']['mode']})，共 {len(ip_set)} 个 {'IPv6' if is_v6 else 'IPv4'}")
        workers = self.config["request_settings"]["max_workers_trace"]
        passed = []
        with ThreadPoolExecutor(max_workers=workers) as executor:
            futs = {executor.submit(self.trace_check, ip, is_v6): ip for ip in ip_set}
            for f in as_completed(futs):
                ip = futs[f]
                ok, cc = f.result()
                if ok:
                    passed.append((ip, cc))
        print(f"✅ SNI 预检通过：{len(passed)} / {len(ip_set)}")

        if len(passed) == 0 and flt.get("fallback_only_cf_range", True):
            print("\n⚠️ 全部 SNI 预检被拦截，触发降级：仅放行 CF 官方段内候选 IP（已排除黑名单）")
            fallback = []
            for ip in ip_set:
                try:
                    obj = ipaddress.IPv6Address(ip) if is_v6 else ipaddress.IPv4Address(ip)
                    if self.is_ip_blacklisted(obj):
                        continue
                    if self.is_ip_in_cf_range(obj):
                        fallback.append((ip, None))
                except Exception:
                    pass
            print(f"ℹ️ 降级后保留 {len(fallback)} / {len(ip_set)} 个 CF 段内 IP")
            return fallback
        return passed

    def run_speed_test_batch(self, ip_list, is_v6: bool):
        if not self.config["speed_settings"]["enabled"]:
            return []
        print(f"\n🚀 开始测速，共 {len(ip_list)} 个 {'IPv6' if is_v6 else 'IPv4'}")
        workers = self.config["request_settings"]["max_workers_speed"]
        res = []
        with ThreadPoolExecutor(max_workers=workers) as executor:
            futs = {executor.submit(self.speed_test, ip, is_v6): ip for ip, _ in ip_list}
            for f in as_completed(futs):
                ip = futs[f]
                r = f.result()
                if r and r.get("tcp") is not None:
                    res.append((ip, r))
        res.sort(key=lambda x: (x[1]["tcp"], x[1]["http_ttfb"] if x[1]["http_ttfb"] is not None else float("inf")))
        top_n = self.config["speed_settings"]["top_n"]
        return res[:top_n]

    def clean_old_non_us_files(self):
        folder = self.config['output_settings']['non_us_folder']
        keep = self.config['output_settings'].get("non_us_keep_snapshots", 10)
        if not os.path.isdir(folder):
            return
        files = []
        for name in os.listdir(folder):
            p = os.path.join(folder, name)
            if os.path.isfile(p) and name.startswith("non_us_ips_"):
                files.append((os.path.getmtime(p), p))
        files.sort(reverse=True)
        for _, p in files[keep:]:
            os.remove(p)
            print(f"🗑️ 清理过期 non-us 文件: {p}")

    def ensure_folders(self):
        non_us_folder = self.config['output_settings']['non_us_folder']
        if not os.path.exists(non_us_folder):
            os.makedirs(non_us_folder)
            print(f'📁 创建文件夹: {non_us_folder}')

    def clean_old_files(self):
        out = self.config['output_settings']
        files = [out['ipv4_filename'], out['ipv6_filename'], out['speed_v4'], out['speed_v6']]
        if out.get("save_pure_ip"):
            files += [out['pure_ipv4'], out['pure_ipv6']]
        for f in files:
            if f and os.path.exists(f):
                os.remove(f)
                print(f'🗑️  删除旧文件: {f}')

    def fetch_url(self, url):
        req_cfg = self.config['request_settings']
        for attempt in range(req_cfg['retry_times'] + 1):
            try:
                headers = {"User-Agent": random.choice(UA_POOL)}
                resp = requests.get(url, headers=headers, timeout=req_cfg['timeout'])
                resp.raise_for_status()
                return resp.text
            except requests.exceptions.RequestException:
                if attempt < req_cfg['retry_times']:
                    time.sleep(req_cfg['retry_delay'])
        print(f'❌ 请求 {url} 多次失败')
        return None

    def extract_ips_from_text(self, text):
        ipv4_raw = self.ipv4_pattern.findall(text)
        ipv6_raw = self.ipv6_pattern.findall(text)
        valid_ipv4 = set()
        valid_ipv6 = set()
        flt = self.config['filter_settings']

        for s in ipv4_raw:
            try:
                ip = ipaddress.IPv4Address(s)
                if flt['remove_private_ips'] and ip.is_private:
                    continue
                if self.is_ip_blacklisted(ip):
                    continue
                if flt['filter_to_cf_range'] and not self.is_ip_in_cf_range(ip):
                    continue
                valid_ipv4.add(str(ip))
            except Exception:
                pass
        for s in ipv6_raw:
            try:
                ip = ipaddress.IPv6Address(s)
                if flt['remove_private_ips'] and ip.is_private:
                    continue
                if self.is_ip_blacklisted(ip):
                    continue
                if flt['filter_to_cf_range'] and not self.is_ip_in_cf_range(ip):
                    continue
                valid_ipv6.add(ip.compressed.lower())
            except Exception:
                pass
        return valid_ipv4, valid_ipv6

    def get_location(self, ip, pre_cc=None):
        loc_cfg = self.config['location_settings']
        if pre_cc is not None and pre_cc != "UNKNOWN":
            if pre_cc in IATA_NAME_MAP:
                name = IATA_NAME_MAP[pre_cc]
            elif pre_cc in CC_NAME_MAP:
                name = CC_NAME_MAP[pre_cc]
            else:
                name = pre_cc
            with self._cache_lock:
                self.cache[ip] = name
            return name, True

        if not loc_cfg['enable_location_query']:
            return "未知", False
        if loc_cfg['use_cache']:
            with self._cache_lock:
                if ip in self.cache:
                    return self.cache[ip], True

        h = {"User-Agent": random.choice(UA_POOL)}
        try:
            url = f"{loc_cfg['baidu_api_url']}?co=&resource_id=6006&oe=utf8&query={ip}"
            r = requests.get(url, headers=h, timeout=5)
            j = r.json()
            if j.get("status") == "0" and j.get("data"):
                loc = j["data"][0].get("location", "未知")
                if loc != "未知":
                    with self._cache_lock:
                        self.cache[ip] = loc
                    return loc, True
        except Exception:
            pass
        try:
            r = requests.get(loc_cfg['fallback_api'] + ip, headers=h, timeout=5)
            j = r.json()
            loc = j.get("country", "未知")
            with self._cache_lock:
                self.cache[ip] = loc
            return loc, True
        except Exception:
            pass
        return "未知", False

    def process_single_ip(self, ip, pre_cc):
        req_delay = self.config["request_settings"]["geo_delay"]
        time.sleep(req_delay)
        location, success = self.get_location(ip, pre_cc)
        if self.config['progress_settings']['show_progress']:
            with self.progress_lock:
                self.completed_count += 1
                if success:
                    self.success_count += 1
                interval = self.config['progress_settings']['progress_interval']
                if self.completed_count % interval == 0 or self.completed_count == self.total_count:
                    rate = (self.success_count / self.completed_count * 100) if self.completed_count else 0
                    print(f'📊 进度: {self.completed_count}/{self.total_count} 成功率 {rate:.1f}%')
        return ip, location, success

    def process_urls_parallel(self):
        all_ipv4, all_ipv6 = set(), set()
        workers = self.config['request_settings']['max_workers_url']
        print(f'🚀 并行拉取 {len(self.urls)} 数据源')
        with ThreadPoolExecutor(max_workers=workers) as executor:
            fu = {executor.submit(self.fetch_url, u): u for u in self.urls}
            for f in as_completed(fu):
                u = fu[f]
                txt = f.result()
                if txt:
                    v4, v6 = self.extract_ips_from_text(txt)
                    all_ipv4.update(v4)
                    all_ipv6.update(v6)
                    print(f'✅ {u} | v4:{len(v4)} v6:{len(v6)}')
        if self.config['filter_settings']['remove_duplicates']:
            all_ipv4 = set(all_ipv4)
            all_ipv6 = set(all_ipv6)
        return all_ipv4, all_ipv6

    def query_ips_parallel(self, trace_passed_list, is_ipv6=False):
        self.completed_count = self.success_count = 0
        self.total_count = len(trace_passed_list)
        if not trace_passed_list:
            return []
        workers_key = "max_workers_ipv6" if is_ipv6 else "max_workers_ipv4"
        workers = self.config['request_settings'][workers_key]
        label = "IPv6" if is_ipv6 else "IPv4"
        print(f'🌍 查询 {self.total_count} {label} 地理位置，线程 {workers}')
        res = []
        with ThreadPoolExecutor(max_workers=workers) as executor:
            fi = {executor.submit(self.process_single_ip, ip, pre_cc): (ip, pre_cc) for ip, pre_cc in trace_passed_list}
            for f in as_completed(fi):
                ip, pre_cc = fi[f]
                try:
                    ip_out, loc, ok = f.result()
                    res.append((ip_out, loc))
                except Exception as e:
                    print(f'❌ {ip} 查询异常 {e}')
                    res.append((ip, "未知"))
        rate = (self.success_count / self.total_count * 100) if self.total_count else 0
        print(f'✅ {label} 查询结束，成功 {self.success_count}/{self.total_count}，成功率 {rate:.1f}%')
        return res

    def is_us_location(self, location):
        if location == "未知":
            return False
        kw = self.config['location_settings']['us_keywords']
        low = location.lower()
        return any(k.lower() in low for k in kw)

    def render_line(self, ip, loc, is_ipv6):
        port = self.config["output_settings"]["port"]
        tpl = self.config["output_settings"]["template"]
        if tpl == "pure":
            return ip
        elif tpl == "clash":
            if is_ipv6:
                return f"[{ip}]:{port}#{loc}"
            else:
                return f"{ip}:{port}#{loc}"
        elif tpl == "v2ray":
            if is_ipv6:
                return f"address: [{ip}], port: {port}, remark: {loc}"
            else:
                return f"address: {ip}, port: {port}, remark: {loc}"
        elif tpl == "sing-box":
            return f'"{ip}", // {loc}'
        else:
            return ip

    def save_results_with_location(self, ip_results, filename, pure_filename, is_ipv6=False):
        if not ip_results:
            with open(filename, "w", encoding="utf-8") as fp:
                fp.write(f"# Cloudflare IP\n# 本次未收集到有效 {'IPv6' if is_ipv6 else 'IPv4'} 地址\n")
            if self.config['output_settings'].get("save_pure_ip"):
                open(pure_filename, "w").close()
            return [], []

        if is_ipv6:
            sorted_list = sorted(ip_results, key=lambda x: ipaddress.IPv6Address(x[0]))
        else:
            sorted_list = sorted(ip_results, key=lambda x: [int(p) for p in x[0].split('.')])
        all_lines, us_lines, nonus_lines, pure_lines = [], [], [], []
        t = self.get_beijing_time().strftime('%Y-%m-%d %H:%M:%S')
        for ip, loc in sorted_list:
            pure_lines.append(ip)
            line = self.render_line(ip, loc, is_ipv6)
            all_lines.append(line)
            if self.is_us_location(loc):
                us_lines.append(line)
            else:
                nonus_lines.append(line)
        if self.config['output_settings']['save_all_ips']:
            with open(filename, "w", encoding="utf-8") as fp:
                fp.write(f"# Cloudflare IP\n# 生成时间 {t}\n# {'IPv6' if is_ipv6 else 'IPv4'}\n")
                fp.write(f"# 总数 {len(all_lines)} US:{len(us_lines)} NonUS:{len(nonus_lines)}\n\n")
                fp.write("\n".join(all_lines))
        if self.config['output_settings'].get("save_pure_ip"):
            with open(pure_filename, "w", encoding="utf-8") as fp:
                fp.write("\n".join(pure_lines))
        print(f'💾 {filename} | 总数 {len(all_lines)} US:{len(us_lines)} NonUS:{len(nonus_lines)}')
        return us_lines, nonus_lines

    def save_speed_result(self, speed_list, filename, is_ipv6):
        if not speed_list:
            with open(filename, "w", encoding="utf-8") as fp:
                fp.write(f"# Speed sorted by TCP RTT\n# 本次未收集到有效 {'IPv6' if is_ipv6 else 'IPv4'} 地址\n")
            return
        t = self.get_beijing_time().strftime('%Y-%m-%d %H:%M:%S')
        with open(filename, "w", encoding="utf-8") as fp:
            fp.write(f"# Speed sorted by TCP RTT, {t}\n")
            fp.write(f"# {'IPv6' if is_ipv6 else 'IPv4'}\n\n")
            for ip, metric in speed_list:
                line = self.render_line(ip, "speed", is_ipv6)
                httpttfb = metric["http_ttfb"] if metric["http_ttfb"] is not None else "N/A"
                fp.write(f"{line}  # tcp={metric['tcp']}ms http_ttfb={httpttfb}ms\n")
        print(f"💾 测速结果保存：{filename}")

    def save_non_us_ips(self, nonus_v4, nonus_v6):
        if not nonus_v4 and not nonus_v6:
            return
        if not self.config['output_settings']['save_non_us_separately']:
            return
        t = self.get_beijing_time().strftime("%Y%m%d_%H%M%S")
        folder = self.config['output_settings']['non_us_folder']
        fn = f"{folder}/non_us_ips_{t}.txt"
        with open(fn, "w", encoding="utf-8") as fp:
            fp.write(f"# Non-US Cloudflare IP\n# {self.get_beijing_time().strftime('%Y-%m-%d %H:%M:%S')}\n")
            fp.write(f"# v4:{len(nonus_v4)} v6:{len(nonus_v6)}\n\n")
            if nonus_v4:
                fp.write("# IPv4\n" + "\n".join(nonus_v4) + "\n\n")
            if nonus_v6:
                fp.write("# IPv6\n" + "\n".join(nonus_v6))
        print(f'💾 非美国 IP: {fn}')
        return fn

    def verify_results(self):
        out = self.config['output_settings']
        print("\n🔍 文件校验")
        speed_files = {out.get('speed_v4'), out.get('speed_v6')}
        for f in [out['ipv4_filename'], out['ipv6_filename'], out.get('speed_v4'), out.get('speed_v6')]:
            if not f or not os.path.exists(f):
                continue
            with open(f, "r", encoding="utf-8") as fp:
                count = 0
                for raw in fp:
                    line = raw.strip()
                    if not line or line.startswith("#"):
                        continue
                    if f in speed_files and "#" in line:
                        line = line.split("#", 1)[0].strip()
                    if line:
                        count += 1
            print(f"📄 {f} : {count} 条有效")

    def test_geo_api(self):
        if not self.config['location_settings']['enable_location_query']:
            print("ℹ️ 地理位置查询关闭")
            return
        test_ips = ["1.1.1.1", "8.8.8.8", "162.159.58.65"]
        print("🧪 测试地理接口")
        for ip in test_ips:
            loc, ok = self.get_location(ip)
            print(f"{'✅' if ok else '❌'} {ip} -> {loc}")
            time.sleep(0.5)

    def print_config_summary(self):
        tr = self.config['trace_settings']
        sp = self.config['speed_settings']
        out = self.config['output_settings']
        print("\n📋 配置摘要")
        print(f"  • 数据源 {len(self.urls)}")
        print(f"  • 地理位置查询 {'开启' if self.config['location_settings']['enable_location_query'] else '关闭'}")
        print(f"  • CF官方段过滤 {'开启' if self.config['filter_settings']['filter_to_cf_range'] else '关闭'}")
        print(f"  • SNI 预检 v4: {self.config['filter_settings']['enable_trace_check_v4']}, v6: {self.config['filter_settings']['enable_trace_check_v6']}")
        print(f"  • SNI 模式 {tr['mode']} | 轮换域名: {tr['sni_domains']}")
        print(f"  • trace 并发 {self.config['request_settings']['max_workers_trace']}")
        print(f"  • 测速 {'开启' if sp['enabled'] else '关闭'}, top {sp['top_n']}")
        print(f"  • non-us 快照保留: {out.get('non_us_keep_snapshots', 10)}")
        print(f"  • 输出模板: {self.config['output_settings']['template']}")

    def main(self):
        print("=" * 50)
        print("🌐 Cloudflare IP地址收集器 v3.3.3")
        print("=" * 50)
        print(f"🕐 {self.get_beijing_time().strftime('%Y-%m-%d %H:%M:%S')}")
        self.print_config_summary()
        self.ensure_folders()
        print("\n" + "=" * 30)
        self.test_geo_api()
        print("\n" + "=" * 30)
        self.clean_old_files()
        self.clean_old_non_us_files()
        v4_set, v6_set = self.process_urls_parallel()
        print(f"\n🎉 初步收集: IPv4 {len(v4_set)} | IPv6 {len(v6_set)}")

        trace_v4 = self.run_trace_filter(v4_set, is_v6=False)
        trace_v6 = self.run_trace_filter(v6_set, is_v6=True)

        nonus_v4, nonus_v6 = [], []
        out_cfg = self.config['output_settings']

        speed_v4 = self.run_speed_test_batch(trace_v4, False)
        speed_v6 = self.run_speed_test_batch(trace_v6, True)
        self.save_speed_result(speed_v4, out_cfg["speed_v4"], False)
        self.save_speed_result(speed_v6, out_cfg["speed_v6"], True)

        if trace_v4:
            res_v4 = self.query_ips_parallel(trace_v4, False)
            _, nonus_v4 = self.save_results_with_location(res_v4, out_cfg['ipv4_filename'], out_cfg['pure_ipv4'], False)
        else:
            self.save_results_with_location([], out_cfg['ipv4_filename'], out_cfg['pure_ipv4'], False)

        if trace_v6:
            res_v6 = self.query_ips_parallel(trace_v6, True)
            _, nonus_v6 = self.save_results_with_location(res_v6, out_cfg['ipv6_filename'], out_cfg['pure_ipv6'], True)
        else:
            self.save_results_with_location([], out_cfg['ipv6_filename'], out_cfg['pure_ipv6'], False)

        self.save_non_us_ips(nonus_v4, nonus_v6)
        self.verify_results()
        print("\n" + "=" * 50)
        print("🎊 全部任务完成")
        print(f"🕐 {self.get_beijing_time().strftime('%Y-%m-%d %H:%M:%S')}")
        print("=" * 50)


